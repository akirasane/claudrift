appId: com.claudrift.app
productName: Claudrift
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
electronVersion: 45.1.0
electronLanguages:
  - en-US
electronDist: node_modules/electron/dist
win:
  target:
    - nsis
  icon: build/icon.ico
  # Runs as the normal user. Elevated drag-drop from Explorer is blocked by Windows and files created by Claude would be
  # owned by Administrators. Preferences > System has a "Relaunch as administrator" button for when it is needed.
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: akirasane
  repo: claudrift
  releaseType: release
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
